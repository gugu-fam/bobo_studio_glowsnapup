name: Local CI
on: [push, pull_request]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
      - name: Install dependencies
        run: flutter pub get
      - name: Static analyze
        run: dart analyze
      - name: Run tests
        run: flutter test --reporter=json > reports/flutter_test_report.json
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
