name: CI

on:
  push:
    branches: [ feature/photo-studio-minimal, handover/GitHub-Copilot ]
  pull_request:
    branches: [ feature/photo-studio-minimal ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Populate model signer public key from secret
        if: secrets.MODEL_SIGNER_PEM != ''
        run: |
          mkdir -p app/src/main/assets/keys
          echo "${{ secrets.MODEL_SIGNER_PEM }}" | base64 --decode > app/src/main/assets/keys/model_signer_pub.pem
          echo "Wrote model_signer_pub.pem"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show repo info
        run: |
          echo "Branch: $GITHUB_REF"
          git rev-parse --abbrev-ref HEAD || true

      - name: Install or fetch CI binaries
        run: bash tools/ci/install_binaries.sh

      - name: Check runtime dependencies
        run: bash tools/check_runtime_dependencies.sh

      - name: Run local validation and generation
        run: bash ci/validate_and_generate_local.sh

      - name: Run semgrep (security rules)
        uses: returntocorp/semgrep-action@v1
        with:
          config: ci/semgrep_rules.yaml
          format: sarif
          output: semgrep-results.sarif
        continue-on-error: true

      - name: Upload semgrep SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: semgrep-results.sarif
        if: always()

      - name: Generate Software Bill of Materials (syft)
        run: |
          if command -v syft >/dev/null 2>&1; then
            syft packages dir:.
            syft -o json . > syft-sbom.json || true
            ls -la syft-sbom.json || true
          else
            echo "syft not installed; skipping SBoM generation"
          fi

      - name: Build (Gradle)
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Generate Jacoco coverage report
        run: |
          ./gradlew jacocoTestReport --no-daemon || true
          echo "COVERAGE_THRESHOLD=${{ env.COVERAGE_THRESHOLD }}"
          export COVERAGE_THRESHOLD=${{ env.COVERAGE_THRESHOLD }} || true
          python3 validators/coverage_check.py || true
          if [ -d app/build/reports/jacoco ]; then
            ls -la app/build/reports/jacoco || true
          fi

      - name: Run lint
        run: ./gradlew lint --no-daemon || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-artifacts
          path: app/build/outputs/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco

  integration:
    name: Integration (manual)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch CI binaries
        run: bash tools/ci/install_binaries.sh

      - name: Set up Android SDK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: "Emulator"
          script: |
            echo "Emulator started"

      - name: Build and run connected tests
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug connectedAndroidTest || true

      - name: Run endurance/integration tests (adb)
        env:
          ANDROID_SERIAL: emulator-5554
        run: |
          bash tools/run_endurance_test.sh || true

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            android/app/build/outputs/
            android/app/build/reports/
            tools/endurance_report.json

  unsigned-report:
    name: Unsigned commits weekly report
    runs-on: ubuntu-latest
    schedule:
      - cron: '0 2 * * 0' # every Sunday at 02:00 UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate unsigned commits report
        run: |
          bash scripts/create_unsigned_commits_report.sh 200

      - name: Upload unsigned commits report
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-commits-report
          path: reports/unsigned_commits_report.md

